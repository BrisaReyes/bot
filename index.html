<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TRADING BOT</title>

<style>
  :root{
    --bg:#3b3b3d;
    --card:#4a4a4c;
    --border:#bfb9b4;
    --text:#e6e6e6;
  }
  body{
    background:var(--bg);
    color:var(--text);
    font-family: Arial, Helvetica, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:30px 10px;
  }

  h1{
    margin:0 0 24px 0;
    font-size:36px;
    letter-spacing:2px;
    font-weight:700;
  }

  .caja{
    width:680px;
    max-width:95%;
    border:2px solid var(--border);
    padding:22px 30px;
    box-sizing:border-box;
    background:transparent;
  }

  .caja label{
    font-size:18px;
    font-weight:700;
  }

  input[type="text"]{
    width:320px;
    padding:10px 12px;
    border:1px solid #8b8b8b;
    background:#2f2f30;
    color:var(--text);
    outline:none;
    box-shadow: 0 2px 0 rgba(0,0,0,0.6);
  }

  .interval-container{
    display:flex;
    gap:15px;
    align-items:center;
  }

  .interval-container button{
    padding:10px 15px;
    background:#1e1e1e;
    border:1px solid #555;
    color:white;
    border-radius:6px;
    cursor:pointer;
  }

  .interval-container button:hover{
    background:#2b2b2b;
  }

  button#aceptar{
    margin-top:18px;
    display:block;
    width:200px;
    padding:10px 22px;
    border:2px solid var(--border);
    background:transparent;
    color:var(--text);
    cursor:pointer;
    font-weight:700;
    box-shadow: 0 3px 0 rgba(0,0,0,0.7);
    margin-left:auto;
    margin-right:auto;
  }

  .respuesta{
    margin-top:36px;
    width:640px;
    max-width:95%;
    border:2px solid var(--border);
    padding:22px;
    font-size:28px;
    font-weight:700;
    text-align:center;
    background:transparent;
  }
</style>

</head>
<body>

<h1>TRADING BOT</h1>

<div class="caja">

  <label for="symbol">PAR DE DIVISAS (ej: EUR/USD, EURUSD, eurusd, eur/usd)</label>
  <br><br>

  <div class="interval-container">
      <input id="symbol" type="text">

      <button id="btn1min">1MIN</button>

      <div id="fiveMinContainer" style="display:none;">
          <button id="btn5min">5MIN</button>
      </div>
  </div>

  <button id="aceptar">ACEPTAR</button>

</div>

<div id="resultado" class="respuesta">ARRIBA / ABAJO</div>

<script>
const API_KEY = "c043c0e49bdb4b50a8c158852dd1e759";

let timeframe = "1min";

// mostrar botón 5min después de tocar 1min
document.getElementById("btn1min").addEventListener("click", () => {
    timeframe = "1min";
    document.getElementById("fiveMinContainer").style.display = "block";
});

document.getElementById("btn5min").addEventListener("click", () => {
    timeframe = "5min";
});

// ----------- ANALISIS ---------------------

function normalizeSymbol(input){
  return input.replace(/\s+/g,'').replace('/','').toUpperCase();
}

function avg(arr){
  return arr.reduce((a,b)=>a+b,0) / arr.length;
}

function prom(closes,n){
  return avg(closes.slice(0,n));
}

async function fetchData(symbol, tf){
  const url = `https://api.twelvedata.com/time_series?symbol=${symbol}&interval=${tf}&outputsize=20&apikey=${API_KEY}`;
  const res = await fetch(url);
  return res.json();
}

function mostrar(t){
  document.getElementById("resultado").innerHTML = t;
}

document.getElementById("aceptar").addEventListener("click", async () => {
  
  const raw = document.getElementById("symbol").value.trim();
  if(!raw){
    mostrar("INGRESA UN PAR");
    return;
  }

  mostrar("Procesando...");

  const symbol = normalizeSymbol(raw);

  try{
    const data = await fetchData(symbol, timeframe);

    if(!data || data.status === "error"){
      mostrar("ERROR API");
      return;
    }

    const closes = data.values.map(v => parseFloat(v.close));

    const p5 = prom(closes,5);
    const p10 = prom(closes,10);
    const p15 = prom(closes,15);

    let decision = "SIN SEÑAL";

    if(p5 > p10 && p10 > p15) decision = "ARRIBA 🟩";
    else if(p5 < p10 && p10 < p15) decision = "ABAJO 🟥";

    mostrar(decision);

  }catch(e){
    mostrar("ERROR");
  }

});
</script>

</body>
</html>
