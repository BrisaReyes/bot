
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRADING BOT</title>

<style>
:root{
  --bg:#3b3b3d;
  --card:#4a4a4c;
  --border:#bfb9b4;
  --text:#e6e6e6;
  --rojo:#d9534f;
  --verde:#28a745;
}

*{box-sizing:border-box}

body{
  margin:0;
  padding:15px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.contenedor{
  max-width:650px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:27px;
  margin:15px 0 25px;
}

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:13px;
  border-radius:6px;
  border:1px solid var(--border);
  background:#333;
  color:white;
  font-size:17px;
  text-align:center;
}

.titulo{
  text-align:center;
  margin-bottom:12px;
  font-weight:bold;
}

.grupo{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

button{
  padding:13px 8px;
  border:1px solid var(--border);
  border-radius:7px;
  background:#39393b;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

button.activo{
  background:#777;
  border:2px solid white;
}

.periodos{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.periodos button{
  padding:14px 4px;
}

.aceptar{
  width:100%;
  background:#68686a;
  margin-top:15px;
  font-size:17px;
}

.resultado{
  text-align:center;
  padding:20px 10px;
  margin-top:15px;
  border-radius:8px;
  background:#333;
  display:none;
}

.direccion{
  font-size:32px;
  font-weight:bold;
  margin:12px;
}

.arriba{color:#40d477}
.abajo{color:#ff6262}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
  font-size:13px;
}

th,td{
  border:1px solid #777;
  padding:8px 4px;
  text-align:center;
}

th{background:#333}

.estado{
  text-align:center;
  font-size:13px;
  margin-top:10px;
  color:#ddd;
}

.error{color:#ff7777}


.aprender-trading{
  display:block;
  width:100%;
  box-sizing:border-box;
  padding:18px;
  margin:20px 0;
  text-align:center;
  background:#4a4a4c;
  border:1px solid #bfb9b4;
  border-radius:12px;
  color:#ffffff;
  font-weight:bold;
  text-decoration:none;
  font-size:16px;
}
  
</style>
</head>

<body>

<div class="contenedor">

<h1>TRADING BOT</h1>
<a href="https://youtu.be/OpfS31D3UoE?si=YCJknUCLNrmzdO4Q"
   target="_blank"
   rel="noopener noreferrer"
   class="aprender-trading">
  APRENDER TRADING ↗️
</a>
  <a href="https://quotex.com/es/demo-trade"
   target="_blank"
   rel="noopener noreferrer"
   class="aprender-trading">
  PLATAFORMA PARA OPERAR ↗️
</a>
<div class="panel">
  <input id="symbol" type="text" value="EUR/USD" placeholder="EUR/USD">
</div>

<div class="panel">
  <div class="titulo">PERÍODO DE VELA</div>

  <div class="grupo">
    <button class="activo" id="btn1min" onclick="seleccionarTiempo('1min',this)">1 MIN</button>
    <button id="btn5min" onclick="seleccionarTiempo('5min',this)">5 MIN</button>
  </div>
</div>

<div class="panel">
  <div class="titulo">CANTIDAD DE VELAS</div>

  <div class="periodos">
    <button class="activo" onclick="seleccionarPeriodo(5,this)">5</button>
    <button onclick="seleccionarPeriodo(10,this)">10</button>
    <button onclick="seleccionarPeriodo(15,this)">15</button>
    <button onclick="seleccionarPeriodo(20,this)">20</button>
  </div>

  <button class="aceptar" id="aceptar" onclick="analizar()">ACEPTAR</button>
</div>

<div class="panel">
  <div class="titulo">RESULTADO</div>

  <div id="resultado" class="resultado">
    <div id="direccion" class="direccion"></div>
    <div id="detalle"></div>
  </div>

  <div id="estado" class="estado">Esperando análisis...</div>
</div>

<div class="panel">
  <div class="titulo">VELAS ANALIZADAS</div>

  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>FECHA</th>
          <th>APERTURA</th>
          <th>MÁXIMO</th>
          <th>MÍNIMO</th>
          <th>CIERRE</th>
          <th>DIRECCIÓN</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
  </div>
</div>

</div>

<script>
let timeframe = "1min";
let periodo = 5;

function seleccionarTiempo(valor,boton){
  timeframe = valor;

  document.querySelectorAll("#btn1min,#btn5min")
    .forEach(b=>b.classList.remove("activo"));

  boton.classList.add("activo");
}

function seleccionarPeriodo(valor,boton){
  periodo = valor;

  document.querySelectorAll(".periodos button")
    .forEach(b=>b.classList.remove("activo"));

  boton.classList.add("activo");
}

async function analizar(){

  const symbol = document.getElementById("symbol").value.trim();
  const estado = document.getElementById("estado");
  const resultado = document.getElementById("resultado");
  const tabla = document.getElementById("tabla");
  const aceptar = document.getElementById("aceptar");

  if(!symbol){
    estado.textContent = "Ingresá un símbolo.";
    return;
  }

  aceptar.disabled = true;
  resultado.style.display = "none";
  tabla.innerHTML = "";
  estado.textContent = "Analizando velas...";

  try{

    const url = `/api/velas?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}`;

    const respuesta = await fetch(url);
    const data = await respuesta.json();

    if(!respuesta.ok){
      throw new Error(data.error || "Error al obtener las velas");
    }

    if(!data.values || data.values.length < periodo){
      throw new Error("No hay suficientes velas disponibles.");
    }

    const velas = data.values.slice(-periodo);

    let subidas = 0;
    let bajadas = 0;
    let neutras = 0;

    velas.forEach(v=>{

      const apertura = Number(v.open);
      const cierre = Number(v.close);

      if(cierre > apertura) subidas++;
      else if(cierre < apertura) bajadas++;
      else neutras++;

      const direccion = cierre > apertura
        ? '<span class="arriba">ALZA</span>'
        : cierre < apertura
        ? '<span class="abajo">BAJA</span>'
        : "NEUTRA";

      tabla.innerHTML += `
        <tr>
          <td>${v.datetime}</td>
          <td>${apertura}</td>
          <td>${v.high}</td>
          <td>${v.low}</td>
          <td>${cierre}</td>
          <td>${direccion}</td>
        </tr>
      `;
    });

    let texto = "";
    let clase = "";

    if(subidas > bajadas){
      texto = "↑ ARRIBA";
      clase = "arriba";
    }else if(bajadas > subidas){
      texto = "↓ ABAJO";
      clase = "abajo";
    }else{
      texto = "SIN DIRECCIÓN CLARA";
      clase = "";
    }

    document.getElementById("direccion").textContent = texto;
    document.getElementById("direccion").className = "direccion " + clase;

    document.getElementById("detalle").textContent =
      `Período: ${periodo} velas | Alzas: ${subidas} | Bajas: ${bajadas} | Neutras: ${neutras}`;

    resultado.style.display = "block";
    estado.textContent = "Análisis completado.";

  }catch(error){
    estado.innerHTML = `<span class="error">${error.message}</span>`;
  }

  aceptar.disabled = false;
}
</script>

</body>
</html>
