<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRADING BOT</title>

<style>
:root{
  --bg:#3b3b3d;
  --card:#4a4a4c;
  --border:#bfb9b4;
  --text:#e6e6e6;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:440px;
  text-align:center;
}

h1{
  font-size:30px;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:15px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  font-size:18px;
  text-align:center;
  margin-bottom:20px;
}

.titulo{
  font-weight:bold;
  margin:15px 0 10px;
}

.timeframes{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.timeframe{
  flex:1;
  padding:13px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  font-size:16px;
  cursor:pointer;
}

.timeframe.activo{
  background:#777;
  border:2px solid white;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--card);
  margin:15px 0;
}

th,td{
  border:1px solid var(--border);
  padding:12px 5px;
  text-align:center;
}

th{
  background:#333335;
  font-size:12px;
}

#aceptar{
  width:100%;
  margin:12px 0;
  padding:15px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  font-size:16px;
  cursor:pointer;
}

#resultado{
  margin-top:22px;
  font-size:26px;
  font-weight:bold;
  min-height:35px;
}

#estado{
  margin-top:12px;
  font-size:14px;
  color:#d0d0d0;
}

.arriba{color:#54d68b;font-weight:bold}
.abajo{color:#ff6666;font-weight:bold}
.neutro{color:#e6e6e6;font-weight:bold}
</style>
</head>

<body>
<div class="container">

<h1>TRADING BOT</h1>

<input
  id="symbol"
  type="text"
  placeholder="EUR/USD"
  value="EUR/USD"
>

<div class="titulo">TIMEFRAME</div>

<div class="timeframes">
  <button id="btn1min" class="timeframe activo">1 MIN</button>
  <button id="btn5min" class="timeframe">5 MIN</button>
</div>

<div class="titulo">ANÁLISIS POR PERÍODO</div>

<table>
<thead>
<tr>
  <th>PERÍODO</th>
  <th>ARRIBA</th>
  <th>ABAJO</th>
  <th>SEÑAL</th>
</tr>
</thead>
<tbody id="tabla">
<tr><td>5</td><td>-</td><td>-</td><td>-</td></tr>
<tr><td>10</td><td>-</td><td>-</td><td>-</td></tr>
<tr><td>15</td><td>-</td><td>-</td><td>-</td></tr>
<tr><td>20</td><td>-</td><td>-</td><td>-</td></tr>
</tbody>
</table>

<button id="aceptar">ACEPTAR</button>

<div id="resultado">ARRIBA / ABAJO</div>
<div id="estado"></div>

</div>

<script>
let timeframe = "1min";

const btn1min = document.getElementById("btn1min");
const btn5min = document.getElementById("btn5min");
const aceptar = document.getElementById("aceptar");
const resultado = document.getElementById("resultado");
const estado = document.getElementById("estado");
const tabla = document.getElementById("tabla");

btn1min.addEventListener("click",()=>{
  timeframe = "1min";
  btn1min.classList.add("activo");
  btn5min.classList.remove("activo");
});

btn5min.addEventListener("click",()=>{
  timeframe = "5min";
  btn5min.classList.add("activo");
  btn1min.classList.remove("activo");
});

aceptar.addEventListener("click",analizar);

function agruparVelas(velas,periodo){

  const minutosBase = timeframe === "1min" ? 1 : 5;
  const cantidad = periodo / minutosBase;
  const grupos = {};

  velas.forEach(v=>{

    const tiempo = new Date(v.datetime).getTime();

    if(!Number.isFinite(tiempo)) return;

    const bloque = Math.floor(
      tiempo / (periodo * 60000)
    );

    if(!grupos[bloque]){
      grupos[bloque] = [];
    }

    grupos[bloque].push(v);
  });

  return Object.keys(grupos)
    .sort((a,b)=>Number(a)-Number(b))
    .map(k=>grupos[k])
    .filter(g=>g.length === cantidad)
    .map(g=>({
      open:g[0].open,
      high:Math.max(...g.map(v=>v.high)),
      low:Math.min(...g.map(v=>v.low)),
      close:g[g.length-1].close
    }));
}

function contarSenales(velas){

  const ultimas = velas.slice(-10);

  let arriba = 0;
  let abajo = 0;

  ultimas.forEach(v=>{
    if(v.close > v.open) arriba++;
    if(v.close < v.open) abajo++;
  });

  let senal = "SIN SEÑAL";

  if(arriba > abajo) senal = "ARRIBA";
  if(abajo > arriba) senal = "ABAJO";

  return {arriba,abajo,senal};
}

async function analizar(){

  const symbol = document.getElementById("symbol").value.trim();

  if(!symbol){
    estado.textContent = "Ingresá un símbolo";
    return;
  }

  resultado.textContent = "ANALIZANDO...";
  estado.textContent = "";
  aceptar.disabled = true;

  try{

    const response = await fetch(
      `/api/velas?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}`
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.message || "Error al obtener las velas");
    }

    if(!data.values || data.values.length < 45){
      throw new Error("No hay suficientes datos");
    }

    const velas = data.values.map(v=>({
      datetime:v.datetime,
      open:Number(v.open),
      high:Number(v.high),
      low:Number(v.low),
      close:Number(v.close)
    })).reverse();

    // Excluir la vela más reciente, que podría estar abierta.
    velas.pop();

    const periodos = [5,10,15,20];
    const resultados = [];

    for(const periodo of periodos){

      const agrupadas = agruparVelas(velas,periodo);

      if(agrupadas.length < 10){
        resultados.push({
          periodo,
          arriba:0,
          abajo:0,
          senal:"DATOS INSUFICIENTES"
        });
        continue;
      }

      resultados.push({
        periodo,
        ...contarSenales(agrupadas)
      });
    }

    tabla.innerHTML = resultados.map(r=>{

      let clase = "neutro";

      if(r.senal === "ARRIBA") clase = "arriba";
      if(r.senal === "ABAJO") clase = "abajo";

      return `
        <tr>
          <td>${r.periodo}</td>
          <td>${r.arriba}</td>
          <td>${r.abajo}</td>
          <td class="${clase}">${r.senal}</td>
        </tr>
      `;
    }).join("");

    const arribaTotal = resultados.filter(
      r=>r.senal === "ARRIBA"
    ).length;

    const abajoTotal = resultados.filter(
      r=>r.senal === "ABAJO"
    ).length;

    if(arribaTotal >= 3){
      resultado.textContent = "ARRIBA 🟩";
      estado.textContent =
        `${arribaTotal} de 4 períodos coinciden en ARRIBA`;
    }
    else if(abajoTotal >= 3){
      resultado.textContent = "ABAJO 🟥";
      estado.textContent =
        `${abajoTotal} de 4 períodos coinciden en ABAJO`;
    }
    else{
      resultado.textContent = "SIN COINCIDENCIA";
      estado.textContent =
        `Arriba: ${arribaTotal} períodos | Abajo: ${abajoTotal} períodos`;
    }

  }catch(error){

    resultado.textContent = "SIN SEÑAL";
    estado.textContent = error.message;

  }finally{
    aceptar.disabled = false;
  }
}
</script>

</body>
</html>
