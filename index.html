
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRADING BOT</title>

<style>
:root{
  --bg:#3b3b3d;
  --card:#4a4a4c;
  --border:#bfb9b4;
  --text:#e6e6e6;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:440px;
  text-align:center;
}

h1{
  font-size:30px;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:15px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  font-size:18px;
  text-align:center;
  margin-bottom:20px;
}

.titulo{
  font-weight:bold;
  margin:15px 0 10px;
}

.timeframes{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.timeframe{
  flex:1;
  padding:13px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  font-size:16px;
  cursor:pointer;
}

.timeframe.activo{
  background:#777;
  border:2px solid white;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--card);
  margin:15px 0;
}

th,td{
  border:1px solid var(--border);
  padding:13px 5px;
  text-align:center;
}

th{
  background:#333335;
  font-size:13px;
}

#aceptar{
  width:100%;
  margin:12px 0;
  padding:15px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  font-size:16px;
  cursor:pointer;
}

#aceptar:disabled{
  opacity:.6;
}

#resultado{
  margin-top:22px;
  font-size:26px;
  font-weight:bold;
  min-height:35px;
}

#estado{
  margin-top:12px;
  font-size:14px;
  color:#d0d0d0;
}

.arriba{
  color:#54d68b;
  font-weight:bold;
}

.abajo{
  color:#ff6666;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="container">

<h1>TRADING BOT</h1>

<input
  id="symbol"
  type="text"
  placeholder="EUR/USD"
  value="EUR/USD"
>

<div class="titulo">TIMEFRAME</div>

<div class="timeframes">
  <button id="btn1min" class="timeframe activo">1 MIN</button>
  <button id="btn5min" class="timeframe">5 MIN</button>
</div>

<div class="titulo">ANÁLISIS POR PERÍODO</div>

<table>
<thead>
<tr>
  <th>PERÍODO</th>
  <th>ARRIBA</th>
  <th>ABAJO</th>
</tr>
</thead>

<tbody id="tabla">
<tr><td>5</td><td>-</td><td>-</td></tr>
<tr><td>10</td><td>-</td><td>-</td></tr>
<tr><td>15</td><td>-</td><td>-</td></tr>
<tr><td>20</td><td>-</td><td>-</td></tr>
</tbody>
</table>

<button id="aceptar">ACEPTAR</button>

<div id="resultado">ARRIBA / ABAJO</div>
<div id="estado"></div>

</div>

<script>
let timeframe = "1min";

const btn1min = document.getElementById("btn1min");
const btn5min = document.getElementById("btn5min");
const aceptar = document.getElementById("aceptar");
const resultado = document.getElementById("resultado");
const estado = document.getElementById("estado");
const tabla = document.getElementById("tabla");

btn1min.addEventListener("click",()=>{
  timeframe = "1min";
  btn1min.classList.add("activo");
  btn5min.classList.remove("activo");
});

btn5min.addEventListener("click",()=>{
  timeframe = "5min";
  btn5min.classList.add("activo");
  btn1min.classList.remove("activo");
});

aceptar.addEventListener("click",analizar);

// Cuenta exactamente las últimas N velas cerradas.
function contarSenales(velas, periodo){

  const ultimas = velas.slice(-periodo);

  let arriba = 0;
  let abajo = 0;
  let neutras = 0;

  for(const v of ultimas){

    if(v.close > v.open){
      arriba++;
    }else if(v.close < v.open){
      abajo++;
    }else{
      neutras++;
    }
  }

  return {
    arriba,
    abajo,
    neutras,
    total:ultimas.length
  };
}

async function analizar(){

  const symbol = document.getElementById("symbol").value.trim();

  if(!symbol){
    estado.textContent = "Ingresá un símbolo";
    return;
  }

  resultado.textContent = "ANALIZANDO...";
  estado.textContent = "";
  aceptar.disabled = true;

  try{

    const response = await fetch(
      `/api/velas?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}`
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "Error al obtener velas");
    }

    if(!data.values || data.values.length < 21){
      throw new Error("Datos insuficientes");
    }

    const velas = data.values.map(v=>({
      datetime:v.datetime,
      open:Number(v.open),
      high:Number(v.high),
      low:Number(v.low),
      close:Number(v.close)
    })).reverse();

    // Se excluye la vela más reciente.
    velas.pop();

    const periodos = [5,10,15,20];

    const resultados = periodos.map(periodo=>{
      return {
        periodo,
        ...contarSenales(velas,periodo)
      };
    });

    tabla.innerHTML = resultados.map(r=>`
      <tr>
        <td>${r.periodo}</td>
        <td class="arriba">${r.arriba}</td>
        <td class="abajo">${r.abajo}</td>
      </tr>
    `).join("");

    const cinco = resultados[0];

    if(cinco.arriba > cinco.abajo){
      resultado.textContent = "ARRIBA 🟩";
    }else if(cinco.abajo > cinco.arriba){
      resultado.textContent = "ABAJO 🟥";
    }else{
      resultado.textContent = "SIN SEÑAL";
    }

    estado.textContent =
      resultados.map(r=>
        `${r.periodo}: ${r.arriba}↑ ${r.abajo}↓`
      ).join(" | ");

  }catch(error){

    resultado.textContent = "SIN SEÑAL";
    estado.textContent = error.message;

  }finally{

    aceptar.disabled = false;

  }
}
</script>

</body>
</html>
