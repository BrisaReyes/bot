<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRADING BOT</title>

<style>
:root{
  --bg:#3b3b3d;
  --card:#4a4a4c;
  --border:#bfb9b4;
  --text:#e6e6e6;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:420px;
  text-align:center;
}

h1{
  font-size:30px;
  margin-bottom:30px;
}

input{
  width:100%;
  padding:15px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  font-size:18px;
  text-align:center;
  margin-bottom:20px;
}

button{
  padding:13px 22px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  font-size:16px;
  cursor:pointer;
  margin:5px;
}

button:active{opacity:.7}

.periodos{
  margin:10px 0 20px;
}

.titulo-periodos{
  font-size:14px;
  margin-bottom:10px;
}

.periodos table{
  width:100%;
  border-collapse:collapse;
}

.periodos td{
  border:1px solid var(--border);
  padding:5px;
  width:50%;
}

.periodo{
  width:100%;
  margin:0;
}

.periodo.activo{
  background:#777;
  border:2px solid white;
  font-weight:bold;
}

#aceptar{
  width:100%;
  margin:10px 0;
}

#resultado{
  margin-top:30px;
  font-size:28px;
  font-weight:bold;
  min-height:40px;
}

#estado{
  margin-top:15px;
  font-size:14px;
  color:#d0d0d0;
}
</style>
</head>

<body>
<div class="container">

  <h1>TRADING BOT</h1>

  <input
    id="symbol"
    type="text"
    placeholder="EUR/USD"
    value="EUR/USD"
  >

  <div class="periodos">
    <div class="titulo-periodos">PERÍODO</div>

    <table>
      <tr>
        <td>
          <button id="btn1min" class="periodo activo">1 MIN</button>
        </td>
        <td>
          <button id="btn5min" class="periodo">5 MIN</button>
        </td>
      </tr>
    </table>
  </div>

  <button id="aceptar">ACEPTAR</button>

  <div id="resultado">ARRIBA / ABAJO</div>
  <div id="estado"></div>

</div>

<script>
let intervalo = "1min";

const btn1min = document.getElementById("btn1min");
const btn5min = document.getElementById("btn5min");
const aceptar = document.getElementById("aceptar");
const resultado = document.getElementById("resultado");
const estado = document.getElementById("estado");
const symbolInput = document.getElementById("symbol");

btn1min.addEventListener("click", () => {
  intervalo = "1min";
  btn1min.classList.add("activo");
  btn5min.classList.remove("activo");
});

btn5min.addEventListener("click", () => {
  intervalo = "5min";
  btn5min.classList.add("activo");
  btn1min.classList.remove("activo");
});

aceptar.addEventListener("click", analizar);

async function analizar(){

  const symbol = symbolInput.value.trim();

  if(!symbol){
    estado.textContent = "Ingresá un símbolo";
    return;
  }

  resultado.textContent = "ANALIZANDO...";
  estado.textContent = "";

  try{
    const response = await fetch(
      `/api/velas?symbol=${encodeURIComponent(symbol)}&interval=${intervalo}`
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.message || "Error al obtener las velas");
    }

    if(!data.values || data.values.length < 16){
      throw new Error("No hay suficientes velas para analizar");
    }

    const velas = data.values
      .map(v => ({
        open:Number(v.open),
        high:Number(v.high),
        low:Number(v.low),
        close:Number(v.close)
      }))
      .reverse();

    // Excluir la última vela, que puede estar abierta.
    velas.pop();

    if(velas.length < 15){
      throw new Error("No hay suficientes velas cerradas");
    }

    let puntosArriba = 0;
    let puntosAbajo = 0;

    const actual = velas[velas.length - 1];
    const anterior = velas[velas.length - 2];

    // Dirección de la vela
    if(actual.close > actual.open) puntosArriba += 1;
    if(actual.close < actual.open) puntosAbajo += 1;

    // Ruptura del máximo o mínimo anterior
    if(actual.close > anterior.high) puntosArriba += 2;
    if(actual.close < anterior.low) puntosAbajo += 2;

    // Rechazo por mecha
    const cuerpo = Math.abs(actual.close - actual.open);
    const mechaSuperior =
      actual.high - Math.max(actual.open,actual.close);
    const mechaInferior =
      Math.min(actual.open,actual.close) - actual.low;

    if(mechaInferior > cuerpo * 1.5) puntosArriba += 1;
    if(mechaSuperior > cuerpo * 1.5) puntosAbajo += 1;

    // Envolvente alcista
    if(
      actual.close > actual.open &&
      anterior.close < anterior.open &&
      actual.open <= anterior.close &&
      actual.close >= anterior.open
    ){
      puntosArriba += 2;
    }

    // Envolvente bajista
    if(
      actual.close < actual.open &&
      anterior.close > anterior.open &&
      actual.open >= anterior.close &&
      actual.close <= anterior.open
    ){
      puntosAbajo += 2;
    }

    // Promedios móviles
    const cierres = velas.map(v => v.close);

    function promedio(cantidad){
      const ultimos = cierres.slice(-cantidad);
      return ultimos.reduce((a,b)=>a+b,0) / ultimos.length;
    }

    const ma5 = promedio(5);
    const ma10 = promedio(10);
    const ma15 = promedio(15);

    if(ma5 > ma10 && ma10 > ma15) puntosArriba += 3;
    if(ma5 < ma10 && ma10 < ma15) puntosAbajo += 3;

    // Resultado
    if(puntosArriba > puntosAbajo){
      resultado.textContent = "ARRIBA 🟩";
    }else if(puntosAbajo > puntosArriba){
      resultado.textContent = "ABAJO 🟥";
    }else{
      resultado.textContent = "SIN SEÑAL";
    }

    estado.textContent =
      `Arriba: ${puntosArriba} | Abajo: ${puntosAbajo}`;

  }catch(error){
    resultado.textContent = "SIN SEÑAL";
    estado.textContent = error.message;
  }
}
</script>

</body>
</html>
