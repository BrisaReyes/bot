<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRADING BOT</title>
<style>
:root{--bg:#3b3b3d;--border:#bfb9b4;--text:#e6e6e6}
body{background:var(--bg);color:var(--text);font-family:Arial;display:flex;flex-direction:column;align-items:center;padding:30px 10px}
h1{margin:0 0 24px;font-size:36px;letter-spacing:2px}
.caja{width:680px;max-width:95%;border:2px solid var(--border);padding:22px 30px;box-sizing:border-box}
label{font-size:18px;font-weight:bold}
input{width:320px;max-width:55%;padding:10px;background:#2f2f30;color:white;border:1px solid #888}
.interval-container{display:flex;gap:15px;align-items:center}
button{padding:10px 15px;background:#1e1e1e;border:1px solid #555;color:white;cursor:pointer}
button#aceptar{display:block;width:200px;margin:18px auto 0;border:2px solid var(--border);background:transparent;color:var(--text);font-weight:bold}
.respuesta{margin-top:36px;width:640px;max-width:95%;border:2px solid var(--border);padding:22px;font-size:28px;font-weight:bold;text-align:center;box-sizing:border-box}
</style>
</head>
<body>

<h1>TRADING BOT</h1>

<div class="caja">
<label for="symbol">PAR DE DIVISAS</label><br><br>

<div class="interval-container">
<input id="symbol" type="text" placeholder="EUR/USD">
<button id="btn1min">1MIN</button>
<div id="fiveMinContainer" style="display:none">
<button id="btn5min">5MIN</button>
</div>
</div>

<button id="aceptar">ACEPTAR</button>
</div>

<div id="resultado" class="respuesta">ARRIBA / ABAJO</div>

<script>
let timeframe = "1min";

const resultado = document.getElementById("resultado");

function mostrar(texto){
  resultado.textContent = texto;
}

document.getElementById("btn1min").onclick = () => {
  timeframe = "1min";
  document.getElementById("fiveMinContainer").style.display = "block";
};

document.getElementById("btn5min").onclick = () => {
  timeframe = "5min";
};

document.getElementById("aceptar").onclick = async () => {

  const cleanSymbol = symbol.replace(/\//g, "").toUpperCase();
url.searchParams.set("symbol", cleanSymbol);
url.searchParams.set("interval", interval);

  if(!symbol) return mostrar("INGRESA UN PAR");

  mostrar("PROCESANDO...");

  try {
    const url = `/api/velas?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}`;

    const response = await fetch(url);
    const data = await response.json();

    if(!response.ok || !data.values){
      return mostrar(data.message || "ERROR API");
    }

    // Orden cronológico
    const candles = data.values.slice().reverse().map(v => ({
      o:Number(v.open),
      c:Number(v.close),
      h:Number(v.high),
      l:Number(v.low)
    }));

    // Excluir vela más reciente
    const closed = candles.slice(0,-1);

    if(closed.length < 15 || closed.some(v =>
      ![v.o,v.c,v.h,v.l].every(Number.isFinite)
    )){
      return mostrar("DATOS INSUFICIENTES");
    }

    let score = 0;

    for(let i=1;i<closed.length;i++){
      const v = closed[i];
      const p = closed[i-1];

      const body = Math.abs(v.c-v.o);
      const upper = v.h-Math.max(v.o,v.c);
      const lower = Math.min(v.o,v.c)-v.l;

      if(v.c>v.o) score++;
      else if(v.c<v.o) score--;

      if(v.c>p.h) score+=2;
      if(v.c<p.l) score-=2;

      if(body>0 && lower>body*2 && v.c>v.o) score+=2;
      if(body>0 && upper>body*2 && v.c<v.o) score-=2;

      // Envolvente alcista
      if(p.c<p.o && v.c>v.o &&
         v.o<=p.c && v.c>=p.o) score+=2;

      // Envolvente bajista
      if(p.c>p.o && v.c<v.o &&
         v.o>=p.c && v.c<=p.o) score-=2;
    }

    const closes = closed.map(v=>v.c);

    const avg = n =>
      closes.slice(-n).reduce((a,b)=>a+b,0)/n;

    const p5 = avg(5);
    const p10 = avg(10);
    const p15 = avg(15);

    if(p5>p10 && p10>p15) score+=3;
    if(p5<p10 && p10<p15) score-=3;

    mostrar(
      score>=3 ? "ARRIBA 🟩" :
      score<=-3 ? "ABAJO 🟥" :
      "SIN SEÑAL"
    );

  } catch(error) {
    mostrar("ERROR DE CONEXIÓN");
  }
};
</script>

</body>
</html>
